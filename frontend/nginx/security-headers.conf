# Security headers for every response (always: errors included). The single source for these headers and the CSP.
#
# nginx only inherits add_header from an outer block when a location sets none of its own, so this file is
# included at server level AND in every location that adds a header (Cache-Control). Add a header here, never in a
# location, or that location silently drops the rest (FE-02).
#
# frame-ancestors cannot be set from a <meta> tag, so it is only enforced from here. index.html keeps a meta copy of
# the rest of the policy for builds served without this nginx (vite preview, a static host); keep the two in step.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Only meaningful over HTTPS; the edge proxy terminates TLS, so this is sent on the HTTPS response it forwards.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
