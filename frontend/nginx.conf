# Serves the built SPA and proxies /api to the backend. TLS is terminated in front of this (load balancer or an
# edge proxy); see docs/deploy.md. The security headers live in nginx/security-headers.conf (copied by the Dockerfile
# to /etc/nginx/snippets/), included wherever headers are added. This file sits inside nginx's http {} block, so map
# and log_format below are valid here.

# The scheme the browser used. A TLS edge in front sets X-Forwarded-Proto: https; pass that on instead of replacing
# it with this hop's plain-http $scheme (the API builds absolute URLs, e.g. the Gmail OAuth redirect, from it).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Access log without query strings or referrers (SEC-04): /api/gmail/push carries its token in ?token=, the OAuth
# callback carries ?code=&state=, and a SPA URL can carry a search for an applicant's name or NPI (?q=).
# $uri is the path only; the rest matches nginx's default "combined" format.
log_format noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log noquery;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Upload limit: a little above the backend's UPLOAD_MAX_TOTAL_MB (default 100), which enforces the real limit.
    client_max_body_size 110m;

    # Security headers on every response, including errors. Inherited by the locations below that add no header of
    # their own (/api/); any location with an add_header must include the snippet again.
    include /etc/nginx/snippets/security-headers.conf;

    # Container health check (Dockerfile HEALTHCHECK): nginx is up and serving, no disk or upstream involved.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-sent events (new-email notifications): no buffering and long reads; the server sends a heartbeat
    # every 25 s, so the hour only bounds a connection that has really gone quiet.
    location = /api/events/stream {
        proxy_pass http://api:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_hide_header X-Powered-By;
    }

    location /api/ {
        proxy_pass http://api:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        # Ordinary requests. Claude actions (reports, drafts, chat) and large uploads can take minutes, so the read
        # timeout allows for them; a hung upstream is still cut off instead of holding the connection for an hour.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Uploads stream to the backend instead of being spooled to disk here.
        proxy_request_buffering off;
        # The API sets its own headers (helmet); hide nginx duplicates of the SPA ones.
        proxy_hide_header X-Powered-By;
    }

    # Hashed bundle files never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which is never cached so a deploy is picked up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
